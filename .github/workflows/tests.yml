name: Tests

on:
  pull_request:
  push:
    branches: [main, 'feature/*']
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/**'
      - 'Silentio/**'
      - 'Silentio.xcodeproj/**'
      - 'SilentioTests/**'
      - 'SilentioUITests/**'
      - 'appcast.xml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: '1.7.12'

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        run: |
          # Download the pinned release from the actionlint repository instead of using a third-party action.
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            --output "$RUNNER_TEMP/download-actionlint.bash"
          bash "$RUNNER_TEMP/download-actionlint.bash" "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  swift:
    name: Lint and unit tests
    # Match the release toolchain using GitHub's arm64 Xcode 27 preview image.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Show toolchain
        run: xcodebuild -version
      # The UI test and the coverage gate need a graphical session and run locally via scripts/test.sh.
      - name: Run lint and unit tests
        run: bash scripts/test.sh --unit-only
